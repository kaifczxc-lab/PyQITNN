[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqitnn"
version = "0.4.1"
description = "Quantum-inspired ternary neural network layers for PyTorch"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["quantum", "ternary", "neural-network", "pytorch", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Homepage = "https://github.com/kaifczxc-lab/PyQITNN"

[project.optional-dependencies]
tokenizers = ["tokenizers>=0.22,<0.23"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyqitnn*"]
